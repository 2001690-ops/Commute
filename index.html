<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연덕갈비 출퇴근 · 직원용</title><meta name="theme-color" content="#204b38"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><a href="/">연덕갈비 <small>출퇴근 관리</small></a><button id="mode" type="button">관리자 모드</button></header>
<main><p id="notice" role="status" aria-live="polite"></p>
<section id="employee"><p class="eyebrow">EMPLOYEE</p><h1>직원 출퇴근</h1><p>오늘의 근무를 확인하고 출퇴근을 기록하세요.</p></section>
<section id="admin" hidden><p class="eyebrow">ADMIN</p><h1>관리자 모드</h1><p>직원과 근무 기록을 관리합니다.</p></section>
<section><button id="installApp" type="button" hidden>홈 화면에 설치</button><p>Android: 브라우저 메뉴의 앱 설치 또는 홈 화면에 추가 · iPhone: Safari 공유 메뉴 → 홈 화면에 추가. 로그인은 설치 후에도 필요합니다.</p></section><section id="loginPanel"><h2 id="loginTitle">직원 로그인</h2><form id="login"><label>아이디<input name="username" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form></section>
<section id="account" hidden><span id="identity"></span><button id="logout" type="button">로그아웃</button></section>
<section id="workPanel" hidden><h2>근무 기록</h2><form id="work"><label id="employeeChoice" hidden>직원<select name="employee_id"></select></label><label>근무일<input name="work_date" type="date" required></label><div class="row"><label>출근<input name="start_time" type="time" value="16:00" required></label><label>퇴근<input name="end_time" type="time" value="22:00" required></label><label>휴게시간(분)<input name="break_minutes" type="number" value="30" min="0" max="720" required></label></div><label class="check"><input name="confirmed" type="checkbox" required>근무시간을 확인했습니다.</label><button>근무 저장</button></form></section>
<section id="adminTools" hidden><h2>직원 등록</h2><form id="newEmployee"><label>이름<input name="display_name" maxlength="80" required></label><label>아이디<input name="username" pattern="[A-Za-z0-9_.-]{3,40}" required></label><label>비밀번호(12자 이상)<input name="password" type="password" minlength="12" autocomplete="new-password" required></label><label>시급(원)<input name="hourly_rate" type="number" min="0" max="1000000" value="12500" required></label><button>직원 등록</button></form><h2>직원별 바로가기 · QR</h2><p>발급은 이전 링크를 교체합니다. 회수는 바로가기만 무효화하며 계정을 정지하지 않습니다.</p><label>직원<select id="shortcutEmployee"></select></label><button id="shortcutissue" type="button">발급 / 재발급</button> <button id="shortcutview" type="button">조회</button> <button id="shortcutrevoke" type="button">회수</button><div id="shortcutResult" hidden><label>직원에게 전달할 URL<input id="shortcutUrl" readonly></label><img id="shortcutQr" width="240" height="240" alt="선택한 직원의 바로가기 QR코드"></div><button id="backup" type="button">데이터 백업</button></section>
<section id="records" hidden><h2>출퇴근 내역</h2><div class="scroll"><table><thead><tr><th>이름</th><th>날짜</th><th>출근</th><th>퇴근</th><th>휴게</th><th>근로시간</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main></body></html>
