<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연덕갈비 출퇴근 관리 · 서버형</title><link rel="stylesheet" href="/app.css"></head><body><div class="wrap"><header><div><h1>연덕갈비 출퇴근 관리</h1><span class="muted">중앙 DB · 직원/관리자 로그인 · 근무 확인</span></div><span class="muted">V5 서버형</span></header><section id="login" class="panel"><h2>로그인</h2><div class="grid"><div><label>아이디</label><input id="username" autocomplete="username"></div><div><label>비밀번호</label><input id="password" type="password" autocomplete="current-password"></div></div><p><button id="loginBtn">로그인</button></p><p id="loginError" class="error"></p></section><main id="app" class="hidden"><section class="panel"><div class="row"><strong id="who"></strong><button class="secondary" id="logout">로그아웃</button><button class="secondary adminOnly" id="backup">DB 백업 생성</button></div></section><section class="panel adminOnly"><h2>직원 계정 생성</h2><div class="grid"><div><label>직원 아이디 (영문/숫자)</label><input id="newUsername"></div><div><label>직원 이름</label><input id="newName"></div><div><label>초기 비밀번호 (12자 이상)</label><input id="newPassword" type="password"></div><div><label>시급(원)</label><input id="newRate" type="number" value="12500"></div></div><p><button id="addEmployee">직원 추가</button></p></section><section class="panel"><h2>근무기록 입력</h2><div class="grid"><div class="adminOnly"><label>직원 선택</label><select id="employee"></select></div><div><label>근무 날짜</label><input id="day" type="date"></div><div><label>출근시간</label><input id="start" type="time" value="14:00"></div><div><label>퇴근시간</label><input id="end" type="time" value="22:00"></div><div><label>휴게시간(분)</label><select id="break"><option value="0">0</option><option value="30" selected>30</option><option value="60">60</option><option value="90">90</option></select></div></div><div class="metric">총 실제 근로시간 (휴게 제외)<div><strong id="total">7시간 30분</strong></div></div><button id="review">근무시간 확인 후 저장</button><p class="muted">동일 직원·날짜의 기록 수정은 관리자만 가능합니다. 주휴·연장수당은 이 버전에서 계산하지 않습니다.</p></section><section class="panel"><h2>저장된 근무기록</h2><div class="scroll"><table><thead><tr><th>날짜</th><th>직원</th><th>출근~퇴근</th><th>휴게</th><th>실근로</th><th>기본급 추정</th></tr></thead><tbody id="rows"></tbody></table></div></section><p id="status" role="status"></p></main></div><div id="overlay" class="overlay hidden"><div class="modal"><h2>실제 근무 확인</h2><p id="summary"></p><div class="metric"><strong id="reviewTotal"></strong></div><label><input type="checkbox" id="agreed"> 출근·퇴근·휴게시간 및 실제 근로시간을 확인했습니다.</label><p class="row"><button id="save" disabled>확인 후 DB 저장</button><button id="cancel" class="secondary">취소</button></p></div></div><script src="/app.js" defer></script></body></html>
